# Translation state for the hand-written documentation.
#
# English (docs/en) is the source of truth; Russian (docs/ru) mirrors it.
# The API reference is not translated: it is generated once, in English.
#
# This file declares which pages form a pair and how complete the translation
# is. Staleness is NOT stored here: docs/check-translations.sh derives it from
# git history by comparing the last commit that touched the English page with
# the last commit that touched the Russian one. A pair created in one commit is
# therefore current, and a pair edited only on the English side is reported.
#
# status:
#   complete  the Russian page covers the English page
#   partial   the Russian page is deliberately shorter (landing pages, api-nav)
#
# Every page under docs/en/ must either appear in `pages` or be listed in
# `untranslated`; the checker reports anything else as an untracked page.

version: 2

pages:
  - en: en/index.md
    ru: ru/index.md
    status: partial

  - en: en/guide/getting_started.md
    ru: ru/guide/getting_started.md
    status: complete

  - en: en/guide/decode.md
    ru: ru/guide/decode.md
    status: complete

  - en: en/guide/encode.md
    ru: ru/guide/encode.md
    status: complete

  - en: en/guide/remux.md
    ru: ru/guide/remux.md
    status: complete

  - en: en/guide/filters.md
    ru: ru/guide/filters.md
    status: complete

  - en: en/guide/subtitles.md
    ru: ru/guide/subtitles.md
    status: complete

  - en: en/guide/hw_codecs.md
    ru: ru/guide/hw_codecs.md
    status: complete

  - en: en/guide/errors.md
    ru: ru/guide/errors.md
    status: complete

  - en: en/api-map.md
    ru: ru/api-nav.md
    status: partial

  - en: en/building.md
    ru: ru/guide/building.md
    status: complete

  - en: en/examples.dox
    ru: ru/examples.dox
    status: complete

untranslated: []
