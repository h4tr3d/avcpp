name: documentation

# Builds the reference and the guides on every pull request, so documentation
# regressions are visible before merge, and republishes the site from master and
# from release tags. See docs/plan/documentation.md, section 9.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned on purpose: docs/doxygen-baseline.txt is only meaningful when the
  # warning output comes from a known doxygen version.
  DOXYGEN_VERSION: 1.18.0
  DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
  DOXYGEN_URL: https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz

jobs:
  build:
    name: build and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Restore doxygen
        id: doxygen-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/doxygen-${{ env.DOXYGEN_VERSION }}
          key: doxygen-${{ env.DOXYGEN_VERSION }}-${{ env.DOXYGEN_SHA256 }}

      - name: Download doxygen
        if: steps.doxygen-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/doxygen.tar.gz" "$DOXYGEN_URL"
          echo "$DOXYGEN_SHA256  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION"
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" \
              -C "$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION" --strip-components=1

      - name: Put doxygen on PATH
        run: echo "$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Show doxygen version
        run: doxygen --version

      - name: Check warnings against the baseline
        run: ./docs/check-warnings.sh

      - name: Build the site
        run: ./docs/build.sh

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: build/docs/site
          retention-days: 7

  deploy:
    name: publish
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: ${{ runner.temp }}/site

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          version=$(tr -d '[:space:]' < VERSION.txt)
          doc_version=${version%.*}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git worktree add --detach "$RUNNER_TEMP/pages" origin/gh-pages
          else
              git worktree add --detach "$RUNNER_TEMP/pages"
              git -C "$RUNNER_TEMP/pages" checkout --orphan gh-pages
              git -C "$RUNNER_TEMP/pages" rm -rf . >/dev/null 2>&1 || true
          fi

          cd "$RUNNER_TEMP/pages"

          # Only the version being published is replaced; older version
          # directories are left alone, so the archive survives.
          rm -rf "$doc_version"
          cp -a "$RUNNER_TEMP/site/$doc_version" "$doc_version"

          rm -rf latest
          cp -a "$doc_version" latest

          "$GITHUB_WORKSPACE/docs/site-index.sh" .

          git add -A
          if git diff --cached --quiet; then
              echo "documentation is unchanged, nothing to publish"
              exit 0
          fi
          git commit -m "docs: publish $version"
          git push origin HEAD:gh-pages
